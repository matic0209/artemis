[workspace]
members = [
    "bin/artemis",
    "bin/cli",
    "crates/artemis-core",
    "crates/generator",
    "crates/strategies/*",
    "crates/clients/*", 
    "examples/*",
]

default-members = ["bin/artemis", "bin/cli"]

[workspace.dependencies]
## eth
ethers = { version = "2", features = ["ws", "rustls"]}
ethers-signers = "2.0"
alloy = { version = "1.0.32" }
alloy-primitives = { version = "1.3.1", default-features = false, features = ["std", "serde"] }
alloy-sol-types = { version = "1.3.1", default-features = false, features = ["std", "json"] }
alloy-json-rpc = { version = "1.0.32" }
alloy-transport = { version = "1.0.32" }
alloy-transport-ws = { version = "1.0.32" }
alloy-transport-http = { version = "1.0.32" }
alloy-provider = { version = "1.0.32" }
alloy-network = { version = "1.0.32" }
alloy-signer = { version = "1.0.32" }
alloy-signer-local = { version = "1.0.32" }


[profile.release]
panic = 'abort'

[profile.dev]
panic = 'abort'


