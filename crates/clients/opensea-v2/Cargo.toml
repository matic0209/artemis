[package]
name = "opensea-v2"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[features]
default = ["sdk-alloy"]
sdk-ethers = ["artemis-core/sdk-ethers"]
sdk-alloy = ["artemis-core/sdk-alloy"]

[dependencies]
reqwest = { version = "0.11.14", default-features = false, features = ["rustls-tls"] }
serde = "1.0.152"
thiserror = "1.0.40"
artemis-core = { path = "../../artemis-core", default-features = false }

[dev-dependencies]
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
