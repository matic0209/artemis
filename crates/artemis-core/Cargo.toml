[package]
name = "artemis-core"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]

## eth
opensea-stream = { git = "https://github.com/FrankieIsLost/opensea-stream-rs"}
mev-share = "0.1.4"

## async
async-trait = "0.1.64"
futures = { version = "0.3" }
reqwest = { version = "0.11.14", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1.18", features = ["full"] }
tokio-stream = { version = "0.1", features = ['sync'] }
jsonrpsee = { version = "0.18", features = ["client", "async-client"] }

## misc
anyhow = "1.0.70"
thiserror = { version = "1.0.40" }
tracing = "0.1.37"
tower = { version = "0.4.13" }
metrics = "0.22"
dashmap = "5"
serde_json = "1.0"
lru = "0.12"
# Pin to same Alloy versions as rbuilder for compatibility
alloy-provider = { version = "1.0.27", features = ["ws", "reqwest"] }
alloy-transport-ws = { version = "1.0.27" }
alloy-transport-http = { version = "1.0.27" }
alloy-rpc-types-eth = { version = "1.0.27" }
alloy-signer-local = { version = "1.0.27" }
alloy-primitives = { version = "1.3.1" }
alloy-rpc-types = { version = "1.0.27" }
alloy-mev = { version = "1.0.0" }
alloy = { version = "1.0.27" }
alloy-signer = { version = "1.0.27" }
alloy-network = { version = "1.0.27" }
# rbuilder integration (optional) - JSON-RPC client only, no direct dependency
uuid = { version = "1.6", optional = true }

[features]
default = []
rbuilder-integration = ["dep:uuid"]

# Optional Alloy deps for future migration. Not used unless `sdk-alloy` is enabled.
