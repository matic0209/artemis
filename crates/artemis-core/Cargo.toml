[package]
name = "artemis-core"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]

## eth
ethers.workspace = true
opensea-stream = { git = "https://github.com/FrankieIsLost/opensea-stream-rs"}
mev-share = "0.1.4"
ethers-flashbots = { git = "https://github.com/FrankieIsLost/ethers-flashbots", features = ["rustls"] }

## async
async-trait = "0.1.64"
futures = "0.3"
reqwest = { version = "0.11.14", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1.18", features = ["full"] }
tokio-stream = { version = "0.1", features = ['sync'] }
jsonrpsee = { version = "0.18", features = ["client", "async-client"] }

## misc
anyhow = "1.0.70"
thiserror = "1.0.40"
tracing = "0.1.37"
tower = "0.4.13"
alloy-provider = { version = "1", optional = true }
alloy-transport-ws = { version = "1", optional = true }
alloy-transport-http = { version = "1", optional = true }
alloy-signer-local = { version = "1", optional = true }
alloy-primitives = { version = "0.8", optional = true }
alloy-rpc-types = { version = "1", optional = true }
alloy-mev = { version = "1.0.0", optional = true }

[features]
default = ["sdk-ethers", "sdk-alloy"]
sdk-ethers = []
sdk-alloy = [
    "dep:alloy-provider",
    "dep:alloy-transport-ws",
    "dep:alloy-transport-http",
    "dep:alloy-signer-local",
    "dep:alloy-primitives",
    "dep:alloy-rpc-types",
    "dep:alloy-mev",
]

# Optional Alloy deps for future migration. Not used unless `sdk-alloy` is enabled.
