[package]
name = "sandwich-strategy"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
artemis-core = { path = "../../core/artemis-core" }
anyhow = "1.0.70"
async-trait = "0.1.64"
tracing = "0.1.37"
tokio = { version = "1.18", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Alloy dependencies (matching artemis-core versions)
alloy-primitives = { version = "1.3.1" }
alloy-provider = { version = "1.0.27" }
alloy-rpc-types-eth = { version = "1.0.27" }
alloy-sol-types = { version = "1.0.27" }
alloy-contract = { version = "1.0.27" }
alloy-mev = { version = "1.0.0" }
alloy-consensus = { version = "1.0.27" }
alloy-eips = { version = "1.0.27" }
alloy-rpc-types-mev = { version = "1.0.27" }
tokio-stream = { version = "0.1", features = ["sync"] }
metrics = "0.22"

# DeFi utilities (removed cfmms for Alloy compatibility)
# cfmms = { git = "https://github.com/0xKitsune/cfmms-rs" }
revm = { version = "28.0.1", features = ["std", "secp256k1"] }
once_cell = "1.19"
hex = "0.4"
reqwest = { version = "0.11", features = ["json"] }
futures = "0.3"

# Performance optimization
rayon = "1.8"
dashmap = "6.1"
lru = "0.12"

[features]
default = []
debug = []
rbuilder-integration = []
