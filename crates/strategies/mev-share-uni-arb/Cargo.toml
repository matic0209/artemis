[package]
name = "mev-share-uni-arb"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.18", features = ["full"] }
mev-share = "0.1.4"
async-trait = "0.1.64"
artemis-core = { path = "../../artemis-core", default-features = false }
anyhow = "1.0.70"
tracing = "0.1.37"
tracing-subscriber = "0.3.16"
csv = "1.1"
serde = { version = "1", features = ["derive"] }
mev-share-bindings = { path = "./bindings", default-features = false }
futures = "0.3"
alloy-eips = { version = "1", optional = true }
alloy-network = { version = "1", optional = true }
alloy-provider = { version = "1", optional = true }
alloy-signer = { version = "1", optional = true }
alloy-signer-local = { version = "1", optional = true }
alloy-primitives = { version = "1", optional = true }
alloy-consensus = { version = "1", optional = true }
primitive-types = { version = "0.12", optional = true }

[features]
default = ["sdk-alloy"]
sdk-ethers = [
    "artemis-core/sdk-ethers",
    "mev-share-bindings/sdk-ethers"
]
sdk-alloy = [
    "artemis-core/sdk-alloy",
    "mev-share-bindings/sdk-alloy",
    "dep:alloy-eips",
    "dep:alloy-network",
    "dep:alloy-provider",
    "dep:alloy-signer",
    "dep:alloy-signer-local",
    "dep:alloy-primitives",
    "dep:alloy-consensus",
    "dep:primitive-types"
]
