[package]
name = "defi-analyzer"
version = "0.1.0"
edition = "2021"

[dependencies]
# Artemis core dependencies
artemis-core = { path = "../../artemis-core" }
async-trait = "0.1.64"
anyhow = "1.0.70"
thiserror = "1.0.40"
tracing = "0.1.37"
serde = { version = "1.0.205", features = ["derive"] }
serde_json = "1.0"

# DeFiAligner integration (temporarily disabled)
# defi_aligner_rs = { path = "../../../defi_aligner_rs" }

# Ethereum dependencies
alloy = "1.0.27"
alloy-primitives = "1.3.1"
alloy-provider = "1.0.27"
alloy-signer = "1.0.27"

# Z3 for symbolic execution
z3 = "0.12"

# Additional utilities
hex = "0.4"
uuid = "1.6"
tokio = { version = "1.18", features = ["full"] }

[features]
default = []
