[package]
name = "defi-analyzer"
version = "0.1.0"
edition = "2021"

[dependencies]
# Artemis integration (enable with working interface)
artemis-core = { path = "../../core/artemis-core" }

# Core dependencies (match artemis-core versions)
async-trait = "0.1.64"
anyhow = "1.0.70"
thiserror = "1.0.40"
tracing = "0.1.37"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.18", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"

# Ethereum dependencies (match artemis-core)
alloy-primitives = "1.3.1"
alloy-provider = { version = "1.0.27", features = ["ws", "reqwest"] }
alloy-rpc-types-eth = "1.0.27"
alloy-signer-local = "1.0.27"

# Z3 for symbolic execution
z3 = "0.12"

# Additional utilities
hex = "0.4"
uuid = { version = "1.6", features = ["v4"] }
regex = "1.10"
sha3 = "0.10"
chrono = "0.4.42"
toml = "0.8"
dashmap = "5"
parking_lot = "0.12"
crossbeam = "0.8"
diff_match_patch = "0.1.1"
rand = "0.8"

[features]
default = []
