version: '3.8'

services:
  defi-analyzer:
    build:
      context: ../../..
      dockerfile: crates/strategies/defi-analyzer/Dockerfile
    container_name: defi-analyzer
    restart: unless-stopped
    environment:
      - RUST_LOG=info
      - DEFI_ANALYZER_DATABASE_URL=postgresql://postgres:password@postgres:5432/defi_analyzer
      - DEFI_ANALYZER_RPC_URL=${DEFI_ANALYZER_RPC_URL}
      - DEFI_ANALYZER_WS_URL=${DEFI_ANALYZER_WS_URL}
      - DEFI_ANALYZER_API_KEY=${DEFI_ANALYZER_API_KEY}
    ports:
      - "8080:8080"  # Health check
      - "9090:9090"  # Metrics
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
      - ./data:/app/data
    depends_on:
      - postgres
      - redis
    networks:
      - defi-analyzer-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  postgres:
    image: postgres:15-alpine
    container_name: defi-analyzer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: defi_analyzer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - defi-analyzer-network

  redis:
    image: redis:7-alpine
    container_name: defi-analyzer-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - defi-analyzer-network
    command: redis-server --appendonly yes

  prometheus:
    image: prom/prometheus:latest
    container_name: defi-analyzer-prometheus
    restart: unless-stopped
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - defi-analyzer-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'

  grafana:
    image: grafana/grafana:latest
    container_name: defi-analyzer-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - defi-analyzer-network
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  defi-analyzer-network:
    driver: bridge
