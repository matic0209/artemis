[package]
name = "opensea-sudo-arb"
version = "0.1.0"
edition = "2021"

[dependencies]

## eth
artemis-core = { path = "../../core/artemis-core", default-features = false }
bindings = { path = "./bindings", default-features = false }
opensea-stream = { git = "https://github.com/FrankieIsLost/opensea-stream-rs"}
opensea-v2 = { path = "../../core/clients/opensea-v2", default-features = false }

## async
async-trait = "0.1.64"
futures = "0.3"

## misc
anyhow = "1.0.70"
tracing = "0.1.37"
metrics = "0.22"
lru = "0.11"
parking_lot = "0.12"
once_cell = { version = "1.19", optional = true }
alloy-primitives = { version = "1", optional = true }
alloy-provider = { version = "1", optional = true }
alloy-rpc-types-eth = { version = "1", optional = true }

[features]
default = [
    "dep:once_cell",
    "dep:alloy-primitives",
    "dep:alloy-provider",
    "dep:alloy-rpc-types-eth",
]

[dev-dependencies]
alloy-transport = "1"
alloy-sol-types = "1"
serde_json = "1"
