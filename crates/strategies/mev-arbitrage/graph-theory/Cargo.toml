[package]
name = "mev-arbitrage-graph"
version = "0.1.0"
edition = "2021"

[dependencies]
# Core dependencies
async-trait = "0.1.64"
anyhow = "1.0.70"
thiserror = "1.0.40"
tracing = "0.1.37"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.18", features = ["full"] }

# Ethereum dependencies
alloy-primitives = "1.3.1"
alloy-provider = { version = "1.0.27", features = ["ws", "reqwest"] }
alloy-rpc-types-eth = "1.0.27"

# Graph theory and math
petgraph = "0.6"
dashmap = "5"
parking_lot = "0.12"
crossbeam = "0.8"

# Utilities
hex = "0.4"
uuid = { version = "1.6", features = ["v4"] }
chrono = "0.4.42"

[features]
default = []
