[package]
name = "mev-arbitrage"
version = "0.1.0"
edition = "2021"

[dependencies]
# 子模块依赖
mev-arbitrage-graph = { path = "./graph-theory", optional = true }
mev-arbitrage-symbolic = { path = "./symbolic-execution", optional = true }
mev-arbitrage-revm = { path = "./revm-validation", optional = true }
mev-arbitrage-defense = { path = "./defense", optional = true }

# Artemis 核心
artemis-core = { path = "../../core/artemis-core" }

# DeFi analyzer (used by legacy hybrid engine)
defi-analyzer = { path = "../defi-analyzer", optional = true }

# Core dependencies
async-trait = "0.1.64"
anyhow = "1.0.70"
thiserror = "1.0.40"
tracing = "0.1.37"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.18", features = ["full"] }

# Ethereum dependencies
alloy-primitives = "1.3.1"
alloy-provider = { version = "1.0.27", features = ["ws", "reqwest"] }
alloy-rpc-types-eth = "1.0.27"

# Z3 for symbolic execution
z3 = "0.12"

# Graph theory
petgraph = "0.6"

# Concurrency
dashmap = "5"
parking_lot = "0.12"
crossbeam = "0.8"

# Utilities
hex = "0.4"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = "0.4.42"
toml = "0.8"

[features]
default = ["lite"]
lite = []
full = [
    "mev-arbitrage-graph",
    "mev-arbitrage-symbolic",
    "mev-arbitrage-revm",
    "mev-arbitrage-defense",
]
# Legacy feature: enables old implementation modules for feature extraction and migration
# Note: These modules have known compilation issues being resolved incrementally
legacy = ["defi-analyzer"]
