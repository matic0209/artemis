[package]
name = "mev-share-uni-arb"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.18", features = ["full"] }
mev-share = "0.1.4"
async-trait = "0.1.64"
artemis-core = { path = "../../core/artemis-core" }
anyhow = "1.0.70"
tracing = "0.1.37"
tracing-subscriber = "0.3.16"
csv = "1.1"
serde = { version = "1", features = ["derive"] }
mev-share-bindings = { path = "./bindings" }
futures = "0.3"
alloy-eips = { version = "1" }
alloy-network = { version = "1" }
alloy-provider = { version = "1" }
alloy-signer = { version = "1" }
alloy-signer-local = { version = "1" }
alloy-primitives = { version = "1" }
alloy-consensus = { version = "1" }
alloy-rpc-types-eth = { version = "1" }
primitive-types = { version = "0.12" }
toml = "0.8"
tempfile = "3.8"

[features]
default = []
full = []
