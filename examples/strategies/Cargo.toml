[package]
name = "arbitrage-strategies"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "complete_arbitrage_strategy"
path = "complete_arbitrage_strategy.rs"

[[bin]]
name = "simplified_arbitrage_example"
path = "simplified_arbitrage_example.rs"

[[bin]]
name = "working_arbitrage_example"
path = "working_arbitrage_example.rs"

[dependencies]
# Core dependencies
anyhow = "1.0.70"
tokio = { version = "1.18", features = ["full"] }
tracing = "0.1.37"
tracing-subscriber = "0.3"

# Ethereum dependencies
alloy-primitives = "1.3.1"
alloy-provider = { version = "1.0.27", features = ["ws", "reqwest"] }
alloy-rpc-types-eth = "1.0.27"
alloy-transport-ws = "1.0.27"

# Artemis core
artemis-core = { path = "../../crates/core/artemis-core" }

# MEV Arbitrage modules
mev-arbitrage-symbolic = { path = "../../crates/strategies/mev-arbitrage/symbolic-execution" }
mev-arbitrage-revm = { path = "../../crates/strategies/mev-arbitrage/revm-validation" }

# Z3 for symbolic execution
z3 = "0.12"

# Utilities
hex = "0.4"
uuid = { version = "1.6", features = ["v4"] }
chrono = "0.4.42"
serde = { version = "1.0", features = ["derive"] }
rand = "0.8"

[features]
default = []
