[package]
name = "mev-share-arb"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"


[dependencies]
tokio = { version = "1.18", features = ["full"] }
dotenv = "0.15.0"
async-trait = "0.1.64"
artemis-core = { path = "../../crates/artemis-core" }
futures = "0.3.27"
mev-share-uni-arb = { path = "../../crates/strategies/mev-share-uni-arb" }
mev-share = "0.1.4"
anyhow = "1.0.70"
tracing = "0.1.37"
tracing-subscriber = "0.3.16"
clap = { version = "4.2.5", features = ["derive"] }
alloy-provider = { version = "1", default-features = false, features = ["ws"] }
alloy-transport-ws = { version = "1" }
alloy-rpc-types-mev = { version = "1" }
alloy-primitives = { version = "1" }

[features]
default = []
