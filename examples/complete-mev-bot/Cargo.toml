[package]
name = "complete-mev-bot"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "complete-mev-bot"
path = "src/main.rs"

[dependencies]
# Artemis integration
artemis-core = { path = "../../crates/artemis-core" }
defi-analyzer = { path = "../../crates/strategies/defi-analyzer" }

# Core dependencies
tokio = { version = "1.18", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1.0"
clap = { version = "4.0", features = ["derive", "env"] }

# Ethereum dependencies
alloy-primitives = "1.3.1"
alloy-provider = { version = "1.0.27", features = ["ws", "reqwest"] }
alloy-signer-local = "1.0.27"

# Configuration
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

# Utilities
futures = "0.3"
uuid = { version = "1.6", features = ["v4"] }
