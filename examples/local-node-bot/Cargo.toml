[package]
name = "local-node-bot"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "artemis-local-node-bot"
path = "src/main.rs"

[dependencies]
# Local MEV arbitrage package
mev-arbitrage = { path = "../../crates/strategies/mev-arbitrage", features = ["full"] }

# Artemis core
artemis-core = { path = "../../crates/core/artemis-core" }

# Async runtime
tokio = { version = "1.37", features = ["full"] }
futures = "0.3"

# Alloy (Ethereum library)
alloy-provider = { version = "1.0.27", features = ["ws", "reqwest", "pubsub"] }
alloy-rpc-types-eth = "1.0.27"
alloy-primitives = "1.3.1"
alloy-transport-ws = "1.0.27"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Configuration
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Utilities
async-trait = "0.1"