[package]
name = "sandwich-bot"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
artemis-core = { path = "../../../crates/core/artemis-core" }
sandwich-strategy = { path = "../../../crates/strategies/sandwich" }
alloy-provider = { version = "1.0.27", features = ["ws"] }
alloy-transport-ws = { version = "1.0.27" }
tokio = { version = "1.18", features = ["full"] }
anyhow = "1.0"
tracing = "0.1.37"
tracing-subscriber = "0.3.16"
clap = { version = "4.2.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
reqwest = { version = "0.11", features = ["json"] }

[features]
default = []
rbuilder-integration = [
    "artemis-core/rbuilder-integration",
    "sandwich-strategy/rbuilder-integration"
]
debug = ["sandwich-strategy/debug"]
