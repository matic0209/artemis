[package]
name = "alloy-quickstart"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0"
tokio = { version = "1.18", features = ["full"] }
artemis-core = { path = "../../crates/core/artemis-core" }
hex = "0.4"
rand = "0.8"

[features]
default = []
full = []

[[bin]]
name = "alloy-quickstart"
path = "src/main.rs"
required-features = ["full"]
