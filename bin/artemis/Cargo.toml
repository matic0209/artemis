[package]
name = "artemis"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"


[dependencies]
tokio = { version = "1.18", features = ["full"] }
dotenv = "0.15.0"
async-trait = "0.1.64"
artemis-core = { path = "../../crates/artemis-core", default-features = false }
opensea-stream = { git = "https://github.com/FrankieIsLost/opensea-stream-rs"}
futures = "0.3.27"
opensea-v2 = { path = "../../crates/clients/opensea-v2", default-features = false }
opensea-sudo-arb = { path = "../../crates/strategies/opensea-sudo-arb", default-features = false }
anyhow = "1.0.70"
tracing = "0.1.37"
tracing-subscriber = "0.3.16"
clap = { version = "4.2.5", features = ["derive"] }
metrics-exporter-prometheus = "0.14"
hyper = { version = "0.14", features = ["full"] }
alloy-provider = { version = "1", optional = true, default-features = false, features = ["ws"] }
alloy-transport-ws = { version = "1", optional = true }

[features]
default = ["sdk-alloy"]
sdk-ethers = [
    "artemis-core/sdk-ethers",
    "opensea-v2/sdk-ethers",
    "opensea-sudo-arb/sdk-ethers",
]
sdk-alloy = [
    "artemis-core/sdk-alloy",
    "opensea-v2/sdk-alloy",
    "opensea-sudo-arb/sdk-alloy",
    "dep:alloy-provider",
    "dep:alloy-transport-ws",
]
